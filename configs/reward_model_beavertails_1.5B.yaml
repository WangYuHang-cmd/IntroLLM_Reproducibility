# Reward model training config for BeaverTails safety bias detection.
# Usage: python src/reward_modeling/train.py --config configs/reward_model_beavertails_1.5B.yaml

model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
torch_dtype: bfloat16
attn_implementation: sdpa

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.1
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj
lora_modules_to_save:
  - score

num_train_epochs: 4
per_device_train_batch_size: 1
per_device_eval_batch_size: 8
gradient_accumulation_steps: 64
learning_rate: 2.0e-05
optim: paged_adamw_32bit
lr_scheduler_type: linear
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: false
max_length: 1024

dataset_dir: dataset/beavertails_dataset_trl
bias_type: safety
output_dir: logs/Qwen2.5-1.5B_safety

logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
seed: 42
report_to: none
